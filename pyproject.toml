# This file exists to pin dev tools (Ruff) via [project.optional-dependencies].
# There is no importable Python package — `pip install -e ".[dev]"` just puts
# ruff on your PATH.  See docs/MAINTAINER.md for setup details.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "odi-skills"
version = "1.0.0"
description = "ODI Claude skills repository — maintainer scripts and tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "ISC" }
authors = [{ name = "CA Office of Data and Innovation" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.9.10",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["node_modules", ".venv", "venv"]

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
